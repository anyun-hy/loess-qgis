    target_protection:
      legacy_behavior: ordinary_protected also denied every protected target
      status: superseded
      v33_location: classes.*.target_growth and decision_engine.relation_rules
      reason: Target growth is independent; 13 may become any surrounding class including protected targets, and 52 may grow.
    semantic_compatibility_table:
      legacy_behavior: source-to-target semantic_compatible_targets table
      status: superseded
      v33_location: decision_engine.relation_rules
      reason: All permitted small-fragment sources now use any-surrounding relation rules; the old semantic table remains audit evidence only.
    enclosed_single_neighbour:
      legacy_behavior: enclosed island proposal used class island cap plus confidence and probability gates
      status: superseded
      v33_location: scenarios.unique_enclosure
      reason: One surrounding class directly absorbs an eligible small fragment; probability and confidence are audit only.
    multi_neighbour_rarity:
      legacy_behavior: V3.2 chose legal targets by live frozen pixel total, target probability, then code
      status: superseded
      v33_location: scenarios.multi_neighbour and decision_engine.statistics
      reason: User froze rarity to raw V3.1 optimization-before shares; target probability then code break ties.
