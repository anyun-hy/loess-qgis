      legacy_behavior: V3.2 recorded contact edges and physical length but did not select by them
      status: moved
      v33_location: scenarios.multi_neighbour.contact_measurement
      reason: Retained as audit-only evidence.
    class_source_and_target_budgets:
      legacy_behavior: 2 percent source and target limits with 0 protected source loss
      status: moved
      v33_location: constraints.budgets and constraints.execution_contract.budget_denominator
      reason: Retained, with the new protected-source set.
    global_acceptance_gates:
      legacy_behavior: V3.1-B/V3.2 final topology rollback and single-label, gap, attachment, connectivity, component, and dynamic-fragment gates
      status: moved
      v33_location: constraints.hard_gates and constraints.post_cleanup_acceptance
      reason: Retained both before publication and after mandatory transport-vector overlay.
    protected_bridge_one_percent_budget:
      legacy_behavior: protected same-class bridges had a separate 1 percent gain limit
      status: moved
      v33_location: constraints.budgets.protected_bridge_gain_fraction
      reason: Retained at 1 percent so the new 52 bridge permission remains bounded.
    bridge_distance_and_footprint_caps:
      legacy_behavior: per-class bridge distance and new-footprint caps
      status: moved
      v33_location: constraints.budgets.bridge_limits and constraints.execution_contract
      reason: Existing numeric caps are actively inherited so the new 52 bridge permission remains bounded.
    exact_cross_target_tie_rejection:
      legacy_behavior: V3.1-B rejected an exact cross-target proposal tie
      status: superseded
      v33_location: decision_engine.precedence and scenarios.multi_neighbour.target_selection
