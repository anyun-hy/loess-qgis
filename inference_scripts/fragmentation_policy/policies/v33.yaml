  "71": {code: 71, name: 河湖库塘, source_absorption: deny, target_growth: allow, same_class_bridge: allow, fragment_max_m2: 50, relation_profile: policy_rules, post_cleanup_obligation: none}

scenarios:
  unique_enclosure:
    match: one_surrounding_class
    source_scope: complete_source_component_only
    target_selection: unique_surrounding_class
    evidence_gates: {semantic: policy_relation_only, probability: audit_only, confidence: audit_only}
  multi_neighbour:
    match: two_or_more_surrounding_classes_without_eligible_bridge
    source_scope: complete_source_component_only
    target_selection: [raw_v31_share_ascending, target_probability_descending, class_code_ascending]
    rarity_source: statistics.raw_v31_optimization_before_share
    contact_measurement: audit_only
    evidence_gates: {semantic: policy_relation_only, probability: audit_only, confidence: audit_only}
  same_class_bridge:
    match: two_or_more_surrounding_classes_and_two_or_more_components_of_selected_target
    source_scope: complete_source_component_only
    target_selection: same_class_only
    evidence_gates: {semantic: policy_relation_only, probability: audit_only, confidence: audit_only}
  invalid_or_ambiguous:
    match: external_contact_or_invalid_pixel_or_incomplete_routing_evidence
    decision: deny

decision_engine:
  default_decision: deny
  precedence: [hard_deny, scenario_routing, source_permission, target_permission, relation_permission, area_budget_topology, target_selection]
  conflict_resolution: [class_permission_hard_deny, higher_specificity, higher_priority, equal_rank_deny_overrides, default_deny]
  scenario_routing:
    order: [invalid_or_ambiguous, unique_enclosure, same_class_bridge, multi_neighbour]
    unique_enclosure_rule: one_distinct_surrounding_class_regardless_of_target_component_count
    bridge_rule: multi_class_boundary_with_at_least_two_components_of_one_selected_target
    multi_neighbour_rule: complete_bridge_check_found_no_eligible_bridge
  # ABAC-like, queryable relation rules.  Class permissions are hard denies.
  # Normal rules select specificity, then priority; a deny wins at equal rank.
  relation_rules:
    - {id: deny_protected_source_12, effect: deny, source: "12", target: "*", scenario: "*", priority: 1000, specificity: 1}
    - {id: deny_protected_source_33, effect: deny, source: "33", target: "*", scenario: "*", priority: 1000, specificity: 1}
    - {id: deny_protected_source_52, effect: deny, source: "52", target: "*", scenario: "*", priority: 1000, specificity: 1}
    - {id: deny_protected_source_71, effect: deny, source: "71", target: "*", scenario: "*", priority: 1000, specificity: 1}
    - {id: allow_dryland_to_any_surrounding, effect: allow, source: "13", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_orchard_to_any_surrounding, effect: allow, source: "21", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_arbor_to_any_surrounding, effect: allow, source: "31", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_shrub_to_any_surrounding, effect: allow, source: "32", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_grass_to_any_surrounding, effect: allow, source: "43", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_urban_to_any_surrounding, effect: allow, source: "51", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_disturbed_to_any_surrounding, effect: allow, source: "53", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_other_built_to_any_surrounding, effect: allow, source: "54", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_rural_road_to_any_surrounding, effect: allow, source: "61", target: "*", scenario: "*", priority: 300, specificity: 1}
    - {id: allow_other_transport_to_any_surrounding, effect: allow, source: "62", target: "*", scenario: "*", priority: 300, specificity: 1}
  proposal_adjudication:
    conflict_set: all_scenarios_single_incremental_pass
    canonical_deduplication: required
    proposal_id_collision: reject
    footprint_conflict: reject
    core_owner: required
    dependency_mode: v31b_incremental
    proposal_rank:
      - {field: dynamic_fragment_reduction, order: descending, value_source: proposal}
      - {field: component_reduction, order: descending, value_source: proposal}
      - {field: target_rarity_share, order: ascending, value_source: decision_engine.statistics.raw_v31_optimization_before_share}
      - {field: target_probability, order: descending, value_source: proposal}
      - {field: changed_area_m2, order: ascending, value_source: proposal}
      - {field: target_class_code, order: ascending, value_source: proposal}
    exact_tie_break: [proposal_digest_ascending, proposal_id_ascending]
  statistics:
    source: "Screenshot: V3.1 optimization-before area and share (2026-08-26 user-provided table)"
    raw_v31_optimization_before_share:
      "12": 0.0013
      "13": 0.3958
      "21": 0.0225
      "31": 0.2196
      "32": 0.0929
