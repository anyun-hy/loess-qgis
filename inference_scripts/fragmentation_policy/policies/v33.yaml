# Selected V3.3 candidate policy. It remains isolated from the production V3 entry.
# All shares below are the screenshot's frozen V3.1 "优化前占比", not a live census.
schema_version: fragmentation-policy/v1
policy:
  id: fragmentation_v33_configurable_absorption_candidate
  version: v33_candidate_20260826
  status: candidate
  baseline: frozen_v3
  connectivity: 4
  single_pass: true
  cascade_generation: false

# source_absorption = may this class disappear when it is the small fragment?
# target_growth = may this class receive that small fragment?
# same_class_bridge = may a small separating footprint connect this class's components?
classes:
  "12": {code: 12, name: 水浇地, source_absorption: deny, target_growth: allow, same_class_bridge: allow, fragment_max_m2: 50, relation_profile: policy_rules, post_cleanup_obligation: none}
  "13": {code: 13, name: 旱地, source_absorption: allow, target_growth: allow, same_class_bridge: deny, fragment_max_m2: 150, relation_profile: policy_rules, post_cleanup_obligation: none}
  "21": {code: 21, name: 果园, source_absorption: allow, target_growth: allow, same_class_bridge: allow, fragment_max_m2: 80, relation_profile: policy_rules, post_cleanup_obligation: none}
